<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ka Shun Decoration</title>
<meta name="description" content="The Nexus is a Z-Depth scroll-stacking industrial tech template with a brushed titanium and acid volt design system.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/templatemo-629-nexus-style.css">
</head>
<body>

<div class="scroll-spacer" aria-hidden="true"></div>

<!-- card 1: the floating hero -->
<section class="zcard card-hero" data-card="1">
  <div class="hero-grid" aria-hidden="true"></div>
  <!--<div class="glass-shape glass-a" aria-hidden="true"></div>-->
  <!--<div class="glass-shape glass-b" aria-hidden="true"></div>-->
  <!--<div class="glass-shape glass-c" aria-hidden="true"></div>-->
  <div class="hero-stage">
    <p class="hero-eyebrow">&nbsp;<i>Decoration</i>&nbsp;</p>
    <h1 class="hero-title">KA SHUN</h1>
    <h2 class="hero-sub-big">專業工藝・誠信服務<br>打造理想空間</h2><!--設計，不止空間<br>而是生活溫度-->
  </div>
  <div class="hero-scroll-hint">向下</div>
</section>

<!-- card 2: the engineered image overlay -->
<section class="zcard card-macro" data-card="2">
  <img class="macro-img" src="img/beautiful-colored-modern-interior-home-living-mockup-with-blank-poster-wall-decoration-sofa-chair-table-etc.jpg" alt="Macro view of the Nexus core module">
  <div class="macro-shade" aria-hidden="true"></div>
  <!--<div class="crosshair-v" aria-hidden="true"></div>
  <div class="crosshair-h" aria-hidden="true"></div>
  <div class="node-dot" aria-hidden="true"></div>-->
  <div class="node-box">
    <p class="node-box-tag-big">將軍澳中心</p>
    <div class="node-stat"><span>呎吋</span><span>445呎</span></div>
    <div class="node-stat"><span>間隔</span><span>2房2廳</span></div>
    <!--<div class="node-stat"><span>SYNC LATENCY</span><span>0.8 ms</span></div>-->
  </div>
  <div class="macro-caption">
    <span class="mono">家<span style="letter-spacing: 0.35em;">.添生活溫度</span></span>
    <h2>設計, 不止是空間</h2>
  </div>
</section>

<!-- card 3: the kinetic accordion fold -->
<section class="zcard card-fold" data-card="3">
  <div class="fold-head">
    <h2>專&nbsp;屬&nbsp;訂&nbsp;製,&nbsp;&nbsp;翻&nbsp;新&nbsp;日&nbsp;常</h2>
    <span class="mono">03 / Hover or tap a column</span>
  </div>
  <div class="accordion" id="accordion">
    <button class="slice" type="button" aria-expanded="false">
      <img class="slice-img" src="img/3d-rendering-loft-luxury-living-room-with-shelf-near-dining-table.jpg" alt="Core processing array">
      <div class="slice-shade" aria-hidden="true"></div>
      <div class="slice-idle">
        <span class="slice-num">01</span>
        <span class="slice-idle-title">日出康城 峻瀅</span>
        <span class="slice-num" aria-hidden="true">+</span>
      </div>
      <div class="slice-reveal">
        <span class="mono">01</span>
        <h3>日出康城 峻瀅</h3>
        <p>Sixty-four hot-swappable compute blades aligned on a single coherent fabric, tuned for sustained full-load operation.</p>
      </div>
    </button>
    <button class="slice" type="button" aria-expanded="false">
      <img class="slice-img" src="img/poster-frame-mock-up-modern-home-living-room-interior-with-white-sofa-coffee-table-with-decor-3d-render.jpg" alt="Liquid cooling fluidics loop">
      <div class="slice-shade" aria-hidden="true"></div>
      <div class="slice-idle">
        <span class="slice-num">02</span>
        <span class="slice-idle-title">健威花園</span>
        <span class="slice-num" aria-hidden="true">+</span>
      </div>
      <div class="slice-reveal">
        <span class="mono">02</span>
        <h3>健威花園</h3>
        <p>A sealed dielectric loop moves heat away from silicon at the source, holding the entire rack within a two degree band.</p>
      </div>
    </button>
    <button class="slice" type="button" aria-expanded="false">
      <img class="slice-img" src="img/3d-rendering-modern-dining-room-living-room-with-luxury-decor.jpg" alt="Power distribution grid">
      <div class="slice-shade" aria-hidden="true"></div>
      <div class="slice-idle">
        <span class="slice-num">03</span>
        <span class="slice-idle-title">荔景 悅麗苑</span>
        <span class="slice-num" aria-hidden="true">+</span>
      </div>
      <div class="slice-reveal">
        <span class="mono">03</span>
        <h3>荔景 悅麗苑</h3>
        <p>Redundant busbars and solid-state switching deliver clean power with zero transfer time when a feed drops.</p>
      </div>
    </button>
    <button class="slice" type="button" aria-expanded="false">
      <img class="slice-img" src="img/3d-rendering-loft-luxury-living-room-with-shelf-near-dining-table1.jpg" alt="Optical interconnect sync layer">
      <div class="slice-shade" aria-hidden="true"></div>
      <div class="slice-idle">
        <span class="slice-num">04</span>
        <span class="slice-idle-title">嘉湖山莊</span>
        <span class="slice-num" aria-hidden="true">+</span>
      </div>
      <div class="slice-reveal">
        <span class="mono">04</span>
        <h3>嘉湖山莊</h3>
        <p>Optical interconnects keep every node phase-locked, so distributed workloads behave like a single machine.</p>
      </div>
    </button>
  </div>
</section>

<!-- card 4: the matrix tabs and signature -->
<section class="zcard card-matrix" data-card="4">
  <div class="matrix-left">
    <p class="mono-tag">04 / Inside the platform</p>
    <h2 style="letter-spacing: 0.2em; line-height: clamp(40px,5vw,75px);">塑造理想家居, <br>迎接煥然一新</h2>
    <div class="matrix-tabs">
      <button class="matrix-tab active" type="button" data-goto="core" aria-selected="true"><!--data-goto="core"-->
        <span class="tab-line"><span class="tab-name">關於我們</span></span>
        <!--<p>The structural heart of the Nexus. A milled aluminum frame that locates every module to within five microns.</p>-->
      </button>
      <button class="matrix-tab" type="button" data-goto="fluidics" aria-selected="false"><!--data-goto="fluidics"-->
        <span class="tab-line"><span class="tab-name">作品集</span></span>
        <!--<p>Quick-disconnect manifolds route coolant through the chassis without a single exposed line.</p>-->
      </button>
      <button class="matrix-tab" type="button" data-goto="sync" aria-selected="false"><!--data-goto="sync"-->
        <span class="tab-line"><span class="tab-name">聯絡我們</span></span>
        <!--<p>A dedicated timing plane distributes a single clock to all nodes, end to end, rack to rack.</p>-->
      </button>
    </div>
  </div>
  <div class="matrix-right">
    <img class="matrix-img active" src="img/3d-rendering-modern-dining-room-living-room-with-luxury-decor-1.jpg" data-panel="core" alt="The Nexus core frame"><!--data-panel="core"-->
    <img class="matrix-img" src="img/stylish-scandinavian-living-room-with-design-mint-sofa-furnitures-mock-up-poster-map-plants-eleg.jpg" data-panel="fluidics" alt="The Nexus fluidics manifold"><!--data-panel="fluidics"-->
    <img class="matrix-img" src="img/modern-scandinavian-home-interior.jpg"  data-panel="sync" alt="The Nexus sync timing plane"><!--data-panel="sync"-->
    <div class="matrix-img-shade" aria-hidden="true"></div>
    <div class="matrix-caption" id="matrixCaption">FIG. 01 / CORE FRAME</div>
  </div>
</section>
	

<!-- permanent hud signature bar              Hidden             -->
<footer class="hud" style="display: none;">
  <a class="hud-brand" href="https://www.templatemo.com/tm-629-nexus-system" target="_blank" rel="nofollow noopener">
    <span class="dot" aria-hidden="true"></span>Nexus System
  </a>
  <span class="hud-credit">FREE CSS TEMPLATES / <a href="https://templatemo.com" target="_blank" rel="nofollow noopener">TEMPLATEMO</a></span>
  <div class="hud-progress">
    <div class="hud-track"><div class="hud-fill" id="hudFill"></div></div>
    <span class="hud-pct" id="hudPct">000%</span>
  </div>
  <div class="hud-nav">
    <button class="hud-arrow" id="navUp" type="button" aria-label="Previous section">
      <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 9L7 4L12 9" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="hud-arrow" id="navDown" type="button" aria-label="Next section">
      <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 5L7 10L12 5" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</footer>

<script src="js/templatemo-629-nexus-script.js"></script>
</body>
</html>
